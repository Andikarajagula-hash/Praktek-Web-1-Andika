<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalkulator Premium</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
        }

        .kalkulator {
            width: 100%;
            max-width: 340px;
            padding: 22px;
            background: #1f2937;
            border-radius: 16px;
            box-shadow: 0 10px 30px #0005;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        #layar {
            width: 100%;
            height: 65px;
            padding: 12px;
            margin-bottom: 12px;
            border: none;
            border-radius: 8px;
            background: #374151;
            color: white;
            text-align: right;
            font-size: 25px;
        }

        .tombol {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            padding: 17px 5px;
            border: none;
            border-radius: 8px;
            background: #4b5563;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.15);
        }

        .operator {
            background: #2563eb;
        }

        .hapus {
            background: #dc2626;
        }

        .sama {
            grid-column: span 4;
            background: #16a34a;
        }

        #areaBayar {
            display: none;
            margin-top: 18px;
            padding: 15px;
            text-align: center;
            background: #374151;
            border-radius: 10px;
        }

        .harga {
            color: #4ade80;
            font-size: 25px;
            font-weight: bold;
            margin: 12px 0;
        }

        .bayar {
            width: 100%;
            background: #f59e0b;
            color: #111827;
            font-weight: bold;
            font-size: 15px;
        }

        #pesan {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            color: #d1d5db;
        }

        .catatan {
            margin-top: 15px;
            color: #9ca3af;
            font-size: 11px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="kalkulator">

        <h2>Kalkulator Premium</h2>

        <input
            type="text"
            id="layar"
            placeholder="0"
            readonly
        >

        <div class="tombol">

            <button onclick="masuk('7')">7</button>
            <button onclick="masuk('8')">8</button>
            <button onclick="masuk('9')">9</button>
            <button class="operator" onclick="masuk('/')">÷</button>

            <button onclick="masuk('4')">4</button>
            <button onclick="masuk('5')">5</button>
            <button onclick="masuk('6')">6</button>
            <button class="operator" onclick="masuk('*')">×</button>

            <button onclick="masuk('1')">1</button>
            <button onclick="masuk('2')">2</button>
            <button onclick="masuk('3')">3</button>
            <button class="operator" onclick="masuk('-')">−</button>

            <button onclick="masuk('0')">0</button>
            <button onclick="masuk('.')">.</button>
            <button class="hapus" onclick="hapus()">C</button>
            <button class="operator" onclick="masuk('+')">+</button>

            <button
                class="sama"
                onclick="mintaBayar()"
            >
                = Lihat Hasil
            </button>

        </div>

        <!-- Bagian pembayaran disembunyikan pada awalnya -->
        <div id="areaBayar">

            <p>🔒 Hasil perhitungan terkunci.</p>

            <p>Bayar untuk membuka hasil perhitungan.</p>

            <div class="harga">Rp500.000</div>

            <button class="bayar" onclick="bayar()">
                Buka Hasil - Rp500.000
            </button>

        </div>

        <div id="pesan">
            Masukkan perhitungan, lalu klik tanda sama dengan.
        </div>

        <div class="catatan">
            Kalkulator Premium
        </div>

    </div>

    <script>
        const layar = document.getElementById("layar");
        const pesan = document.getElementById("pesan");
        const areaBayar = document.getElementById("areaBayar");

        let ekspresi = "";
        let hasilMenunggu = null;
        let sudahBayar = false;

        // Memasukkan angka atau operator
        function masuk(nilai) {
            ekspresi += nilai;
            layar.value = ekspresi;

            pesan.textContent = "Perhitungan siap.";

            areaBayar.style.display = "none";
            hasilMenunggu = null;
        }

        // Menghapus perhitungan
        function hapus() {
            ekspresi = "";
            hasilMenunggu = null;

            layar.value = "";

            areaBayar.style.display = "none";

            pesan.textContent =
                "Masukkan perhitungan, lalu klik tanda sama dengan.";
        }

        // Menghitung dan meminta pembayaran jika belum dibuka
        function mintaBayar() {
            if (!ekspresi) {
                pesan.textContent =
                    "Masukkan angka terlebih dahulu.";
                return;
            }

            // Hanya mengizinkan angka dan operator matematika dasar
            if (!/^[0-9+\-*/.() ]+$/.test(ekspresi)) {
                pesan.textContent =
                    "Perhitungan tidak valid.";
                return;
            }

            try {
                const hasil = Function(
                    '"use strict"; return (' + ekspresi + ')'
                )();

                if (!Number.isFinite(hasil)) {
                    throw new Error("Hasil tidak valid");
                }

                hasilMenunggu = hasil;

                if (!sudahBayar) {
                    areaBayar.style.display = "block";

                    pesan.textContent =
                        "Hasil terkunci. Lakukan pembayaran untuk melihatnya.";

                    return;
                }

                tampilkanHasil();

            } catch (error) {
                hasilMenunggu = null;

                areaBayar.style.display = "none";

                pesan.textContent =
                    "Perhitungan tidak valid.";
            }
        }

        // SIMULASI PEMBAYARAN, BUKAN PEMBAYARAN SUNGGUHAN
        function bayar() {
            if (hasilMenunggu === null) {
                pesan.textContent =
                    "Masukkan perhitungan terlebih dahulu.";
                return;
            }

            if (sudahBayar) {
                tampilkanHasil();
                return;
            }

            const konfirmasi = confirm(
                "SIMULASI PEMBAYARAN\n\n" +
                "Anggap pembayaran Rp500.000 berhasil?"
            );

            if (konfirmasi) {
                sudahBayar = true;
                tampilkanHasil();
            }
        }

        // Menampilkan hasil perhitungan
        function tampilkanHasil() {
            if (hasilMenunggu === null) {
                return;
            }

            layar.value = hasilMenunggu;

            areaBayar.style.display = "none";

            pesan.textContent =
                "Hasil perhitungan: " + hasilMenunggu;
        }
    </script>

</body>
</html>
